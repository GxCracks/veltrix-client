<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">NFL Minecraft Skins</title>
  <desc id="desc">Zwei blockige NFL Figuren im schwarz-grünen Neon-Design: links mit Krone, rechts mit hellem Haar und roten Hörnern.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110c"/>
      <stop offset="0.55" stop-color="#0b2418"/>
      <stop offset="1" stop-color="#031008"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a0ffca"/>
      <stop offset="0.45" stop-color="#42f58d"/>
      <stop offset="1" stop-color="#0fc965"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f8f5"/>
      <stop offset="1" stop-color="#9ca9a1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="48" fill="url(#bg)"/>
  <g opacity=".22" filter="url(#soft)">
    <circle cx="190" cy="160" r="140" fill="#42f58d"/>
    <circle cx="1010" cy="210" r="170" fill="#19c766"/>
    <circle cx="650" cy="760" r="220" fill="#2ef07e"/>
  </g>
  <g opacity=".18" stroke="#72ffb0" stroke-width="2">
    <path d="M0 140h1200M0 280h1200M0 420h1200M0 560h1200M0 700h1200"/>
    <path d="M120 0v900M300 0v900M480 0v900M660 0v900M840 0v900M1020 0v900"/>
  </g>

  <!-- Crowned skin -->
  <g transform="translate(120 84)">
    <g filter="url(#glow)">
      <rect x="164" y="0" width="260" height="72" rx="12" fill="#ffd52c"/>
      <rect x="184" y="-26" width="46" height="54" fill="#ffdf3f"/>
      <rect x="264" y="-34" width="46" height="62" fill="#ffdf3f"/>
      <rect x="344" y="-26" width="46" height="54" fill="#ffdf3f"/>
      <rect x="210" y="14" width="30" height="30" fill="#2678ff"/>
      <rect x="304" y="14" width="30" height="30" fill="#113cff"/>
      <rect x="374" y="14" width="30" height="30" fill="#65e66a"/>
    </g>
    <rect x="174" y="66" width="242" height="208" rx="16" fill="#e7b89a"/>
    <path d="M174 74h242v94h-38v-34h-44v34H218v-34h-44z" fill="#402b23"/>
    <rect x="216" y="164" width="54" height="58" fill="#f7f7f7"/>
    <rect x="318" y="164" width="54" height="58" fill="#f7f7f7"/>
    <rect x="232" y="176" width="28" height="34" fill="#313639"/>
    <rect x="334" y="176" width="28" height="34" fill="#313639"/>

    <rect x="120" y="286" width="350" height="390" rx="30" fill="#080c0a"/>
    <rect x="120" y="310" width="350" height="44" fill="#162019"/>
    <rect x="154" y="324" width="34" height="312" fill="url(#metal)"/>
    <rect x="400" y="324" width="34" height="312" fill="url(#metal)"/>
    <path d="M210 318l78 96 78-96 48 64-58 54 42 42-66 86-44-58-44 58-66-86 42-42-58-54z" fill="#0c1911" stroke="#42f58d" stroke-width="16" filter="url(#glow)"/>
    <circle cx="288" cy="444" r="52" fill="#0d1611" stroke="#65ffad" stroke-width="12"/>
    <path d="M254 428l34 20 34-20-11 42-23 22-23-22z" fill="url(#neon)"/>
    <text x="288" y="548" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="64" fill="#f7fff9" stroke="#0dd76a" stroke-width="3">NFL</text>
    <rect x="58" y="300" width="86" height="310" rx="28" fill="#0a0e0c" transform="rotate(12 101 455)"/>
    <rect x="448" y="300" width="86" height="310" rx="28" fill="#0a0e0c" transform="rotate(-12 491 455)"/>
    <path d="M80 338l48 26-26 48 34 52-44 88" fill="none" stroke="#46f58d" stroke-width="18" filter="url(#glow)"/>
    <path d="M508 338l-48 26 26 48-34 52 44 88" fill="none" stroke="#46f58d" stroke-width="18" filter="url(#glow)"/>
    <rect x="150" y="656" width="118" height="130" fill="#080c0a"/>
    <rect x="310" y="656" width="118" height="130" fill="#080c0a"/>
    <rect x="150" y="710" width="118" height="28" fill="#31ef82" filter="url(#glow)"/>
    <rect x="310" y="710" width="118" height="28" fill="#31ef82" filter="url(#glow)"/>
    <rect x="136" y="780" width="150" height="56" rx="14" fill="#f3f5f4"/>
    <rect x="294" y="780" width="150" height="56" rx="14" fill="#f3f5f4"/>
  </g>

  <!-- Blonde horned skin -->
  <g transform="translate(620 112)">
    <g filter="url(#glow)">
      <rect x="126" y="18" width="38" height="58" fill="#d20b18" transform="rotate(-18 145 47)"/>
      <rect x="356" y="18" width="38" height="58" fill="#d20b18" transform="rotate(18 375 47)"/>
    </g>
    <rect x="136" y="62" width="250" height="218" rx="16" fill="#f0c7ad"/>
    <path d="M136 66h250v82h-34v304h-52V160h-42v340h-54V160h-34v250h-34z" fill="#f4d9c4"/>
    <rect x="186" y="166" width="54" height="52" fill="#f8f8f8"/>
    <rect x="290" y="166" width="54" height="52" fill="#f8f8f8"/>
    <rect x="198" y="178" width="30" height="28" fill="#3e4244"/>
    <rect x="302" y="178" width="30" height="28" fill="#3e4244"/>
    <rect x="126" y="300" width="300" height="356" rx="28" fill="#080c0a"/>
    <path d="M178 330l72 72 72-72 50 58-48 58 40 38-54 78-60-60-60 60-54-78 40-38-48-58z" fill="#0d1711" stroke="#42f58d" stroke-width="14" filter="url(#glow)"/>
    <circle cx="250" cy="438" r="43" fill="#0b1310" stroke="#65ffad" stroke-width="10"/>
    <path d="M222 425l28 16 28-16-9 34-19 18-19-18z" fill="url(#neon)"/>
    <text x="250" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="54" fill="#f7fff9" stroke="#0dd76a" stroke-width="3">NFL</text>
    <rect x="70" y="312" width="78" height="266" rx="24" fill="#0a0e0c" transform="rotate(18 109 445)"/>
    <rect x="404" y="312" width="78" height="266" rx="24" fill="#0a0e0c" transform="rotate(-18 443 445)"/>
    <path d="M98 342l38 24-20 42 30 44-36 82" fill="none" stroke="#46f58d" stroke-width="16" filter="url(#glow)"/>
    <path d="M454 342l-38 24 20 42-30 44 36 82" fill="none" stroke="#46f58d" stroke-width="16" filter="url(#glow)"/>
    <rect x="156" y="636" width="96" height="122" fill="#080c0a"/>
    <rect x="278" y="636" width="96" height="122" fill="#080c0a"/>
    <rect x="156" y="690" width="96" height="22" fill="#31ef82" filter="url(#glow)"/>
    <rect x="278" y="690" width="96" height="22" fill="#31ef82" filter="url(#glow)"/>
    <rect x="144" y="748" width="120" height="50" rx="12" fill="#f3f5f4"/>
    <rect x="266" y="748" width="120" height="50" rx="12" fill="#f3f5f4"/>
  </g>

  <g opacity=".75" filter="url(#glow)" fill="#4bff9b">
    <rect x="80" y="760" width="16" height="16" transform="rotate(45 88 768)"/>
    <rect x="1080" y="150" width="14" height="14" transform="rotate(45 1087 157)"/>
    <rect x="1040" y="700" width="22" height="22" transform="rotate(45 1051 711)"/>
    <rect x="560" y="90" width="12" height="12" transform="rotate(45 566 96)"/>
  </g>
</svg>
