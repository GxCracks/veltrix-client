name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'downloads/VELTRIX-Client-0.8.0-Windows.zip'
      - '.github/installer/veltrix-0.8.1.patch.b64.*'
      - '.github/installer/veltrix-startup-debug-class.b64'
      - '.github/installer/veltrix-0.8.2-rightrail-fix.b64.*'
      - 'assets/veltrix-logo.png'
      - '.github/workflows/build-windows-installer.yml'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Windows packaging tools are available
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) {
            $candle = Get-ChildItem 'C:\Program Files (x86)' -Filter candle.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $candle) { throw 'WiX candle.exe was not found after installation.' }
          $wixBin = if ($candle.Source) { Split-Path -Parent $candle.Source } else { $candle.DirectoryName }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

          if (-not (Get-Command magick.exe -ErrorAction SilentlyContinue)) {
            choco install imagemagick.app --no-progress -y
          }
          $magick = Get-Command magick.exe -ErrorAction SilentlyContinue
          if (-not $magick) {
            $magick = Get-ChildItem 'C:\Program Files' -Filter magick.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $magick) { throw 'ImageMagick magick.exe was not found after installation.' }
          $magickBin = if ($magick.Source) { Split-Path -Parent $magick.Source } else { $magick.DirectoryName }
          Add-Content -Path $env:GITHUB_PATH -Value $magickBin

      - name: Build VELTRIX Windows icon
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          magick assets\veltrix-logo.png -background none -define icon:auto-resize=256,128,64,48,32,16 build\veltrix-installer.ico
          if (-not (Test-Path build\veltrix-installer.ico)) { throw 'VELTRIX installer icon was not generated.' }

      - name: Reconstruct known-good VELTRIX 0.8.2 launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build\public | Out-Null
          New-Item -ItemType Directory -Force -Path build\input | Out-Null
          New-Item -ItemType Directory -Force -Path build\patch081 | Out-Null
          New-Item -ItemType Directory -Force -Path build\startupFix | Out-Null
          New-Item -ItemType Directory -Force -Path build\rightRailFix | Out-Null

          Expand-Archive -LiteralPath downloads\VELTRIX-Client-0.8.0-Windows.zip -DestinationPath build\public -Force
          $base = 'build\public\VELTRIX-Client-0.8.0\VELTRIX-Launcher-0.8.0.jar'
          if (-not (Test-Path $base)) { throw "Base launcher missing: $base" }
          $target = 'build\input\VELTRIX-Launcher-0.8.2.jar'
          Copy-Item -LiteralPath $base -Destination $target -Force

          $parts081 = @(
            '.github\installer\veltrix-0.8.1.patch.b64.00.00',
            '.github\installer\veltrix-0.8.1.patch.b64.00.01',
            '.github\installer\veltrix-0.8.1.patch.b64.00.02',
            '.github\installer\veltrix-0.8.1.patch.b64.00.03',
            '.github\installer\veltrix-0.8.1.patch.b64.01',
            '.github\installer\veltrix-0.8.1.patch.b64.02',
            '.github\installer\veltrix-0.8.1.patch.b64.03.00',
            '.github\installer\veltrix-0.8.1.patch.b64.03.01',
            '.github\installer\veltrix-0.8.1.patch.b64.03.02',
            '.github\installer\veltrix-0.8.1.patch.b64.03.03',
            '.github\installer\veltrix-0.8.1.patch.b64.04',
            '.github\installer\veltrix-0.8.1.patch.b64.05.00',
            '.github\installer\veltrix-0.8.1.patch.b64.05.01',
            '.github\installer\veltrix-0.8.1.patch.b64.05.02',
            '.github\installer\veltrix-0.8.1.patch.b64.05.03',
            '.github\installer\veltrix-0.8.1.patch.b64.06'
          )
          foreach ($part in $parts081) {
            if (-not (Test-Path $part)) { throw "Missing 0.8.1 patch part: $part" }
          }
          $b64 = ($parts081 | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          $patch081 = 'build\veltrix-0.8.1-patch.zip'
          [IO.File]::WriteAllBytes($patch081, [Convert]::FromBase64String($b64))
          Expand-Archive -LiteralPath $patch081 -DestinationPath build\patch081 -Force
          jar --update --file $target -C build\patch081 .
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply the known-good 0.8.1 patch.' }

          $startupB64 = (Get-Content '.github\installer\veltrix-startup-debug-class.b64' -Raw).Trim()
          $startupZip = 'build\veltrix-0.8.2-startup-fix.zip'
          [IO.File]::WriteAllBytes($startupZip, [Convert]::FromBase64String($startupB64))
          $startupHash = (Get-FileHash $startupZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($startupHash -ne '9d98f237e612ad61b3df19ee9e62d48403d063101f5c4b731eb3bd8746de82e8') {
            throw "Startup patch integrity check failed: $startupHash"
          }
          Expand-Archive -LiteralPath $startupZip -DestinationPath build\startupFix -Force
          jar --update --file $target -C build\startupFix .
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply the 0.8.2 startup-resilience patch.' }

          # The old installer patch contained a corrupted RightRail.class. Always
          # overwrite it last with the three classes extracted from the working 0.8.1 JAR.
          $rightRailParts = @(
            '.github\installer\veltrix-0.8.2-rightrail-fix.b64.00',
            '.github\installer\veltrix-0.8.2-rightrail-fix.b64.01',
            '.github\installer\veltrix-0.8.2-rightrail-fix.b64.02'
          )
          foreach ($part in $rightRailParts) {
            if (-not (Test-Path $part)) { throw "Missing validated RightRail patch part: $part" }
          }
          $rightRailB64 = ($rightRailParts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          $rightRailZip = 'build\veltrix-0.8.2-rightrail-good.zip'
          [IO.File]::WriteAllBytes($rightRailZip, [Convert]::FromBase64String($rightRailB64))
          $rightRailZipHash = (Get-FileHash $rightRailZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rightRailZipHash -ne 'aee89f97cebb348ad8540b8a574b1e4e2137e6e0d438e06d3e6e6a706355f82e') {
            throw "Validated RightRail ZIP integrity check failed: $rightRailZipHash"
          }
          Expand-Archive -LiteralPath $rightRailZip -DestinationPath build\rightRailFix -Force
          jar --update --file $target -C build\rightRailFix .
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply validated RightRail classes.' }

          $listing = (& jar tf $target) -join "`n"
          $requiredClasses = @(
            'dev/veltrix/launcher/LauncherConfig.class',
            'dev/veltrix/launcher/VeltrixLauncherApp.class',
            'dev/veltrix/launcher/auth/MicrosoftMinecraftAuthService.class',
            'dev/veltrix/launcher/launch/MinecraftLaunchCoordinator.class',
            'dev/veltrix/launcher/ui/AccountDialog.class',
            'dev/veltrix/launcher/ui/PlayView.class',
            'dev/veltrix/launcher/ui/RightRail.class',
            'dev/veltrix/launcher/ui/RightRail$1.class',
            'dev/veltrix/launcher/ui/RightRail$2.class'
          )
          foreach ($class in $requiredClasses) {
            if ($listing -notmatch [regex]::Escape($class)) { throw "Missing launcher class: $class" }
          }

          & javap -classpath $target -verbose dev.veltrix.launcher.LauncherConfig *> build\launcher-config-javap.txt
          if ($LASTEXITCODE -ne 0) { throw 'LauncherConfig.class is malformed.' }
          & javap -classpath $target -verbose dev.veltrix.launcher.VeltrixLauncherApp *> build\launcher-app-javap.txt
          if ($LASTEXITCODE -ne 0) { throw 'VeltrixLauncherApp.class is malformed.' }
          & javap -classpath $target -verbose dev.veltrix.launcher.ui.RightRail *> build\rightrail-javap.txt
          if ($LASTEXITCODE -ne 0) { throw 'RightRail.class is malformed.' }

          $launcherAppJavap = Get-Content build\launcher-app-javap.txt -Raw
          foreach ($token in @('LOCALAPPDATA','launcher-startup.log','launcher-startup-error.log','setDefaultUncaughtExceptionHandler')) {
            if ($launcherAppJavap -notmatch [regex]::Escape($token)) { throw "Startup diagnostics contract missing: $token" }
          }

          Remove-Item -Recurse -Force build\rightRailHash -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path build\rightRailHash | Out-Null
          Push-Location build\rightRailHash
          jar xf ..\input\VELTRIX-Launcher-0.8.2.jar dev/veltrix/launcher/ui/RightRail.class
          Pop-Location
          $rightRailClassHash = (Get-FileHash 'build\rightRailHash\dev\veltrix\launcher\ui\RightRail.class' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rightRailClassHash -ne '17cbc326cb2b6ffe47b23480e0cdefb35ceac2ed519a9e65a6f043fd9361d17b') {
            throw "Unexpected RightRail.class hash after patching: $rightRailClassHash"
          }

          & java -cp $target dev.veltrix.launcher.VeltrixLauncher --diagnose
          if ($LASTEXITCODE -ne 0) { throw 'Launcher diagnostic mode failed before packaging.' }

      - name: Regression test corrupt persisted settings
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $jar = (Resolve-Path 'build\input\VELTRIX-Launcher-0.8.2.jar').Path
          $testDir = Join-Path $PWD 'build\bad-config-test'
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          Set-Content -LiteralPath (Join-Path $testDir 'launcher.properties') -Value 'bad=\uZZZZ' -Encoding ascii

          @'
          import dev.veltrix.launcher.LauncherConfig;
          import java.nio.file.Path;
          public class BadConfigRegression {
              public static void main(String[] args) {
                  LauncherConfig config = new LauncherConfig(Path.of(args[0]));
                  config.load();
                  if (!config.get("bad", "fallback").equals("fallback")) System.exit(3);
                  if (config.loadWarning().isBlank()) System.exit(4);
                  System.out.println(config.loadWarning());
              }
          }
          '@ | Set-Content -LiteralPath build\BadConfigRegression.java -Encoding ascii

          javac -cp $jar -d build build\BadConfigRegression.java
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile corrupt-config regression test.' }
          java -cp "$jar;build" BadConfigRegression $testDir
          if ($LASTEXITCODE -ne 0) { throw 'Corrupt persisted settings can still crash launcher startup.' }

      - name: Verify Java runtime modules
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $jar = 'build\input\VELTRIX-Launcher-0.8.2.jar'
          $modules = (& jdeps --multi-release 21 --ignore-missing-deps --print-module-deps $jar).Trim()
          Write-Host "Detected static modules: $modules"
          $required = @('java.base','java.desktop','java.net.http','jdk.httpserver')
          foreach ($module in $required) {
            if ($modules -notmatch [regex]::Escape($module)) { throw "Required module not detected: $module" }
          }
          $available = (& java --list-modules) -join "`n"
          if ($available -notmatch 'jdk\.crypto\.ec@') { throw 'JDK 21 does not provide jdk.crypto.ec.' }
          Write-Host 'TLS crypto module available: jdk.crypto.ec'

      - name: Build native Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          jpackage `
            --type exe `
            --name VELTRIX `
            --app-version 0.8.2 `
            --vendor VELTRIX `
            --description "VELTRIX Client - independent Minecraft Java launcher" `
            --input build\input `
            --main-jar VELTRIX-Launcher-0.8.2.jar `
            --main-class dev.veltrix.launcher.VeltrixLauncher `
            --add-modules java.base,java.desktop,java.net.http,jdk.httpserver,jdk.crypto.ec `
            --dest dist `
            --icon build\veltrix-installer.ico `
            --win-per-user-install `
            --win-upgrade-uuid 1F377226-50A4-4D61-9DC7-92DCD7CDE700 `
            --win-menu `
            --win-menu-group VELTRIX `
            --win-shortcut `
            --win-dir-chooser `
            --install-dir VELTRIX
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed with exit code $LASTEXITCODE" }

          $built = Get-ChildItem -LiteralPath dist -Filter '*.exe' | Select-Object -First 1
          if (-not $built) { throw 'jpackage did not create an EXE installer.' }
          $target = Join-Path $built.DirectoryName 'VELTRIX-Setup-0.8.2.exe'
          if ($built.FullName -ne $target) {
            Move-Item -LiteralPath $built.FullName -Destination $target -Force
          }
          if (-not (Test-Path $target)) { throw 'VELTRIX-Setup-0.8.2.exe is missing after rename.' }
          Write-Host "Installer created: $target"

      - name: Install and prove packaged VELTRIX actually opens
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'dist\VELTRIX-Setup-0.8.2.exe').Path
          $install = Start-Process -FilePath $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer smoke test failed with exit code $($install.ExitCode)" }

          $exe = Join-Path $env:LOCALAPPDATA 'VELTRIX\VELTRIX.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem $env:LOCALAPPDATA -Filter VELTRIX.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) { throw 'Installed VELTRIX.exe not found after installation.' }
          Write-Host "Installed executable: $exe"

          $diag = Start-Process -FilePath $exe -ArgumentList '--diagnose' -Wait -PassThru
          if ($diag.ExitCode -ne 0) { throw "Installed VELTRIX diagnostic failed with exit code $($diag.ExitCode)" }

          $veltrixHome = Join-Path $env:USERPROFILE '.veltrix'
          $logs = Join-Path $env:LOCALAPPDATA 'VELTRIX\logs'
          New-Item -ItemType Directory -Force -Path $veltrixHome | Out-Null
          Remove-Item -Recurse -Force $logs -ErrorAction SilentlyContinue
          Set-Content -LiteralPath (Join-Path $veltrixHome 'launcher.properties') -Value 'bad=\uZZZZ' -Encoding ascii

          $gui = Start-Process -FilePath $exe -PassThru
          $startupLog = Join-Path $logs 'launcher-startup.log'
          $errorLog = Join-Path $logs 'launcher-startup-error.log'
          $deadline = (Get-Date).AddSeconds(20)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            if ($gui.HasExited) { break }
            if (Test-Path $startupLog) {
              $text = Get-Content $startupLog -Raw
              if ($text -match 'UI startup complete') { $ready = $true; break }
            }
            Start-Sleep -Milliseconds 500
          }

          if (-not $ready) {
            Write-Host '--- launcher-startup.log ---'
            if (Test-Path $startupLog) { Get-Content $startupLog } else { Write-Host '(missing)' }
            Write-Host '--- launcher-startup-error.log ---'
            if (Test-Path $errorLog) { Get-Content $errorLog } else { Write-Host '(missing)' }
            if ($gui.HasExited) { throw "Installed VELTRIX exited during startup. Exit code: $($gui.ExitCode)" }
            Stop-Process -Id $gui.Id -Force -ErrorAction SilentlyContinue
            throw 'Installed VELTRIX never reported a completed UI startup.'
          }

          if ($gui.HasExited) { throw "VELTRIX exited after reporting startup complete. Exit code: $($gui.ExitCode)" }
          Write-Host 'PASS: installed VELTRIX reached UI startup complete and stayed running.'
          Get-Content $startupLog
          Stop-Process -Id $gui.Id -Force

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELTRIX-Setup-0.8.2
          path: dist/VELTRIX-Setup-0.8.2.exe
          if-no-files-found: error

      - name: Publish GitHub Release asset
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.8.2'
          $asset = 'dist\VELTRIX-Setup-0.8.2.exe'
          $savedPreference = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $savedPreference

          if ($releaseExists) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --target "${{ github.sha }}" --title 'VELTRIX Client 0.8.2' --notes 'Fixes the Windows no-window startup crash by replacing the corrupted RightRail classes with validated classes from the working launcher. Also keeps the TLS crypto runtime fix, recovers malformed persisted settings, writes startup diagnostics to LocalAppData, and is release-gated by launching the installed Windows app and confirming UI startup.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publishing failed.' }
