<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>VELTRIX — Redirecting</title>
  <script>
    (() => {
      const base = '/veltrix-client';
      let path = (window.location.pathname.replace(/\/+$/, '') || '/').toLowerCase();
      if (path.startsWith(base)) path = path.slice(base.length) || '/';
      const routes = {
        '/download': base + '/#download',
        '/features': base + '/#why-veltrix',
        '/news': base + '/#news',
        '/privacy': base + '/privacy.html'
      };
      window.location.replace(routes[path] || base + '/');
    })();
  </script>
</head>
<body></body>
</html>
